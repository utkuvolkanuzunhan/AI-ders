<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}

<div class='w'><div class='top'>🟤 Maillard Tepkimesinin Hızı<small>Etkileyen etkenler (Factors)</small></div><div class='l' id='l'></div><div class='lg' id='g'></div><div class='h'>Ne yapacaksın: bir etkene dokun. Ne göreceksin: o etkenin hızı hangi yöne değiştirdiği ve nedeni.</div></div>
<script>(function(){

['🍬','Şeker türü','u','İndirgen şeker gerekir; pentozlar heksozlardan daha reaktiftir.'],

for(var k=0;k<es.length;k++)(function(k){var r=es[k].firstChild;r.onclick=function(){sel(k)};r.onkeydown=function(e){if(e.key=='Enter'||e.key==' '){e.preventDefault();sel(k)}}})(k);es[0].classList.add('on')})()</script>
