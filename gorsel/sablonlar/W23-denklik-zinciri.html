<!-- W23 | Denklik / ispat zinciri, dokunulabilir | Birbirini gerektiren ifadeler (ör. tersinirlik denklikleri, 1 ⇒ 2 ⇒ 3 ⇒ 4 ⇒ 1); karta dokununca bir sonrakini nasıl gerektirdiği açılır (D dizisi veridir: numara, ifade, kısa not, neden) -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.dn,.dn *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.dn{color:var(--text-primary);font-family:inherit;padding:6px}.dn [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.dn .hd{text-align:center;font-size:16px;font-weight:800;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--c4) 22%,transparent);border:2px solid var(--c4)}.dn .cd{margin-top:8px;border-radius:14px;border:2px solid var(--c);border-left-width:10px;background:color-mix(in srgb,var(--c) 10%,transparent);padding:12px 14px;min-height:60px}.dn .cd.on{background:color-mix(in srgb,var(--c) 26%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 28%,transparent)}.dn .tp{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:700;line-height:1.3}.dn .nb{flex:none;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--c);color:#fff}.dn .sb{font-size:15px;color:var(--text-secondary);margin:4px 0 0 40px}.dn .why{display:none;margin:10px 0 0 0;font-size:16px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--surface-1)}.dn .cd.on .why{display:block}.dn .ar{text-align:center;font-size:20px;line-height:1;color:var(--text-secondary);margin-top:6px}.dn .c1{--c:var(--c1)}.dn .c2{--c:var(--c2)}.dn .c3{--c:var(--c3)}.dn .c4{--c:var(--c4)}.dn .c5{--c:var(--c5)}.dn .rt{margin-top:8px;text-align:center;font-size:15px;font-weight:700;color:var(--c4)}.dn .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}</style><div class='dn' id='dn'></div><div class='dn'><div class='h'>Ne yapacaksın, ne göreceksin: bir karta dokun; altında o ifadenin bir sonrakini nasıl gerektirdiği açılır. Dört kartın dönmesi (1 ⇒ 2 ⇒ 3 ⇒ 4 ⇒ 1) hepsinin denk olduğunu gösterir.</div></div><script>(function(){var D=[["1", "A tersinirdir", "A⁻¹ vardır.", "1 ⇒ 2: Ax = 0 ise iki tarafı A⁻¹ ile soldan çarp: x = A⁻¹·0 = 0. Başka çözüm çıkamaz."], ["2", "Ax = 0 yalnız x = 0 çözümüne sahiptir", "Aşikâr olmayan çözüm yok.", "2 ⇒ 3: Serbest değişken olsaydı sonsuz çözüm çıkardı. Serbest değişken yok, yani her sütunda öncü 1 var: n sütun, n öncü 1. Bu da indirgenmiş formun I olması demek."], ["3", "A matrisinin indirgenmiş eşelon formu I'dır", "A → I satır işlemleriyle gidilir.", "3 ⇒ 4: A matrisini I yapan işlemlerin elemanter matrisleri E₁, …, Eₖ için Eₖ⋯E₁A = I. Buradan A = E₁⁻¹⋯Eₖ⁻¹ ve elemanter matrisin tersi de elemanterdir."], ["4", "A elemanter matrislerin çarpımıdır", "A = E₁E₂⋯Eₖ biçiminde yazılır.", "4 ⇒ 1: Her elemanter matris tersinirdir ve tersinir matrislerin çarpımı tersinirdir. Başa döndük: dört ifade birbirine denk."], ["5", "Her b için Ax = b'nin tek çözümü x = A⁻¹b", "Sistem hep tutarlı.", "1 ⇒ 5: x = A⁻¹b çözümdür (A·A⁻¹b = b). Başka çözüm x₁ olsaydı Ax₁ = b'den x₁ = A⁻¹b çıkardı: tek çözüm."]],el=document.getElementById('dn'),h='<div class="hd">A (n×n) için bu beş ifade birbirine denk</div>';D.forEach(function(d,i){if(i==4)h+='<div class="rt">↺ 1–4 döngü kapandı; 5. ifade 1 ile bağlı</div>';else if(i>0)h+='<div class="ar">⇓</div>';h+='<div role="button" tabindex="0" class="cd c'+(i+1)+'" data-i="'+i+'"><div class="tp"><span class="nb">'+d[0]+'</span><span>'+d[1]+'</span></div><div class="sb">'+d[2]+'</div><div class="why">'+d[3]+'</div></div>'});el.innerHTML=h;el.querySelectorAll('.cd').forEach(function(c){function f(){c.classList.toggle('on')}c.onclick=f;c.onkeydown=function(e){if(e.key=='Enter'||e.key==' ')f()}})})()</script>
