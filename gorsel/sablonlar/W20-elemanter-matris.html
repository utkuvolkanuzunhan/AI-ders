<!-- W20 | Elemanter matris, sekmeli | Elemanter matris tanımı: E·A, A matrisine aynı satır işlemini uygular ve E⁻¹ işlemi geri alır; üç işlem sekmesi (D dizisi veridir: işlem, E, A, EA, E⁻¹, değişen satırlar, not). 3×3; kesir hücresi f1_2 biçiminde yazılır -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.em,.em *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.em{color:var(--text-primary);font-family:inherit;padding:6px}.em [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.em .tb{display:flex;gap:8px}.em .tb [role=button]{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700;line-height:1.2;padding:6px;border-radius:12px;border:2px solid var(--border);background:var(--surface-1)}.em .tb [role=button].on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 26%,transparent);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 25%,transparent)}.em .op{margin-top:12px;font-size:20px;font-weight:800;color:var(--c4);text-align:center}.em .ln{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin-top:12px;font-size:17px;font-weight:700}.em .lb{font-size:15px;font-weight:700;color:var(--text-secondary)}.em .bx{background:var(--surface-1);border-radius:12px;padding:10px 8px;margin-top:12px}.em .mxs{display:inline-grid;vertical-align:middle;border-left:3px solid currentColor;border-right:3px solid currentColor;border-radius:6px;padding:2px 5px;gap:2px 4px;font-variant-numeric:tabular-nums;line-height:1.2}.em .mxs>span{min-width:26px;text-align:center;border-radius:6px;padding:2px 1px}.em .mxs>span.hi{background:color-mix(in srgb,var(--c3) 32%,transparent);color:var(--text-primary)}.em .fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.05;font-size:.82em}.em .fr>span:first-child{border-bottom:.09em solid currentColor;padding:0 .12em .04em}.em .nt{margin-top:12px;font-size:16px;line-height:1.45;background:var(--surface-1);border-left:8px solid var(--c1);border-radius:12px;padding:10px 14px}.em .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}</style><div class='em'><div class='tb' id='tb'></div><div class='op' id='op'></div><div class='bx'><div class='ln' id='l1'></div><div class='ln' id='l2'></div></div><div class='bx'><div class='ln' id='l3'></div></div><div class='nt' id='nt'></div><div class='h'>Ne yapacaksın, ne göreceksin: üstten bir işlem seç. E birim matristen tek işlemle çıkar; EA çarpımında A matrisine aynı işlem uygulanır (turuncu kutular değişen satırlar). Altta E matrisinin tersi var.</div></div><script>(function(){var D=[{"n": "Satır toplama", "op": "R₂ − 2R₁ → R₂", "E": [["1", "0", "0"], ["-2", "1", "0"], ["0", "0", "1"]], "A": [["1", "2", "3"], ["2", "5", "3"], ["1", "0", "8"]], "EA": [["1", "2", "3"], ["0", "1", "-3"], ["1", "0", "8"]], "Ei": [["1", "0", "0"], ["2", "1", "0"], ["0", "0", "1"]], "inv": "R₂ + 2R₁ → R₂", "hi": [1], "note": "2. satırdan 1. satırın 2 katı çıkarıldı; yalnız 2. satır değişti. E⁻¹ bunu geri ekler."}, {"n": "Yer değiştirme", "op": "R₂ ↔ R₃", "E": [["1", "0", "0"], ["0", "0", "1"], ["0", "1", "0"]], "A": [["1", "2", "3"], ["2", "5", "3"], ["1", "0", "8"]], "EA": [["1", "2", "3"], ["1", "0", "8"], ["2", "5", "3"]], "Ei": [["1", "0", "0"], ["0", "0", "1"], ["0", "1", "0"]], "inv": "R₂ ↔ R₃ (kendisi)", "hi": [1, 2], "note": "2. ve 3. satırlar yer değişti. İki kez yapınca eski hale döner: E⁻¹ = E."}, {"n": "Ölçekleme", "op": "2R₂ → R₂", "E": [["1", "0", "0"], ["0", "2", "0"], ["0", "0", "1"]], "A": [["1", "2", "3"], ["2", "5", "3"], ["1", "0", "8"]], "EA": [["1", "2", "3"], ["4", "10", "6"], ["1", "0", "8"]], "Ei": [["1", "0", "0"], ["0", "f1_2", "0"], ["0", "0", "1"]], "inv": "R₂ ÷ 2 → R₂", "hi": [1], "note": "2. satırın her elemanı 2 ile çarpıldı. Geri almak için 2 ile bölmek gerekir: E⁻¹ matrisinde bu bölme kesir olarak görünür."}];var $=function(i){return document.getElementById(i)};function cl(v){var m=/^f(-?\d+)_(\d+)$/.exec(v);if(m)return '<span class="fr"><span>'+m[1]+'</span><span>'+m[2]+'</span></span>';return v.replace(/^-/,'−')}function mx(M,hi){var h='<span class="mxs" style="grid-template-columns:repeat(3,auto)">';M.forEach(function(r,i){r.forEach(function(v){h+='<span'+(hi.indexOf(i)>=0?' class="hi"':'')+'>'+cl(v)+'</span>'})});return h+'</span>'}var k=0;function draw(){var d=D[k];$('op').textContent=d.op;$('l1').innerHTML='<span class="lb">E</span>'+mx(d.E,d.hi)+'<span>·</span><span class="lb">A</span>'+mx(d.A,[]);$('l2').innerHTML='<span>=</span><span class="lb">EA</span>'+mx(d.EA,d.hi);$('l3').innerHTML='<span class="lb">E⁻¹</span>'+mx(d.Ei,d.hi)+'<span class="lb">'+d.inv+'</span>';$('nt').textContent=d.n+': '+d.note;var b=$('tb').children;for(var i=0;i<b.length;i++)b[i].className=i==k?'on':''}var h='';D.forEach(function(d,i){h+='<div role="button" tabindex="0" data-k="'+i+'">'+d.n+'</div>'});$('tb').innerHTML=h;Array.prototype.forEach.call($('tb').children,function(b){b.onclick=function(){k=+b.dataset.k;draw()};b.onkeydown=function(e){if(e.key=='Enter'||e.key==' '){k=+b.dataset.k;draw()}}});draw()})()</script>
