<!-- W16 | Devre şeması + göz akımı sekmeleri | Çözümlenecek devre: eleman etiketi ve değeri, kaynak kutbu, toprak ve düğüm adı, göz akımı oku; sekmelerle KGY denklemi ve Gauss çözümü (iki gözlü örnek, veri değişir) -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w8,.w8 *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w8{color:var(--text-primary);padding:6px}.w8 [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.w8 svg text{font-size:22px !important;font-weight:600;fill:var(--text-primary)}.w8 svg .sw{stroke:var(--text-primary);fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.w8 .lg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.w8 .lg div{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--surface-1);font-size:14px;line-height:1.3}.w8 .lg svg{flex:none}.w8 .lg b{font-weight:800}.w8 .tb{display:flex;gap:8px;margin-bottom:10px}.w8 .tb [role=button]{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;font-weight:700;line-height:1.2;padding:6px;border-radius:12px;border:2px solid var(--border);background:var(--surface-1);transition:transform .15s}.w8 .tb [role=button].on{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 24%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 30%,transparent);transform:translateY(-2px)}.w8 .bx{padding:12px 14px;font-size:17px;line-height:1.7;border-radius:12px;background:var(--surface-1);border-left:8px solid var(--c1);min-height:150px}.w8 .bx b{font-weight:800}.w8 .bx .k{color:var(--text-secondary);font-size:15px}.w8 .bx .r{color:var(--c3);font-weight:800}.w8 .mm{display:inline-grid;grid-template-columns:repeat(3,auto);gap:3px 12px;vertical-align:middle;padding:3px 10px;border-left:4px solid var(--text-primary);border-right:4px solid var(--text-primary);border-radius:6px;font-weight:800;margin:3px 6px 3px 0}.w8 .mm span:nth-child(3n){border-left:3px dashed var(--text-secondary);padding-left:10px}.w8 .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}</style><div class='w8'><svg id='g' viewBox='0 0 560 300' width='100%'></svg><div class='lg'><div><svg width='54' height='20' viewBox='0 0 54 20'><path class='sw' d='M2 10 H10 L14 2 L22 18 L30 2 L38 18 L42 10 H52'/></svg><span><b>Direnç</b> (resistor) · R · Ω</span></div><div><svg width='44' height='34' viewBox='0 0 44 34'><circle class='sw' cx='22' cy='17' r='13'/><text x='22' y='16' text-anchor='middle' style='font-size:14px !important;font-weight:800'>+</text><text x='22' y='28' text-anchor='middle' style='font-size:14px !important;font-weight:800'>−</text></svg><span><b>DC gerilim kaynağı</b> (voltage source) · V · V</span></div></div><div class='tb' id='tb'></div><div class='bx' id='bx'></div><div class='h'>Ne yapacaksın, ne göreceksin: Sekmelere dokun; her göz çizimde boyanır, KGY denklemi ve Gauss ile akımlar (kΩ · mA = V) adım adım çıkar.</div></div><script>(function(){var $=function(i){return document.getElementById(i)},NS='http://www.w3.org/2000/svg';function zh(x1,x2,y){var n=6,d=(x2-x1)/n,p='M'+x1+' '+y;for(var k=0;k<n;k++)p+=' L'+(x1+d*(k+.5))+' '+(y+(k%2?12:-12));return p+' L'+x2+' '+y}function zv(x,y1,y2){var n=6,d=(y2-y1)/n,p='M'+x+' '+y1;for(var k=0;k<n;k++)p+=' L'+(x+(k%2?12:-12))+' '+(y1+d*(k+.5));return p+' L'+x+' '+y2}function arc(cx,cy,r,l){return '<path d="M'+cx+' '+(cy-r)+' A'+r+' '+r+' 0 1 1 '+(cx-r)+' '+cy+'" class="sw" style="stroke:var(--c4)"/><polygon points="'+(cx-r)+','+(cy-9)+' '+(cx-r-7)+','+(cy+3)+' '+(cx-r+7)+','+(cy+3)+'" style="fill:var(--c4)"/><text x="'+cx+'" y="'+(cy+8)+'" text-anchor="middle" style="fill:var(--c4)">'+l+'</text>'}function src(cx,cy,top){return '<circle class="sw" cx="'+cx+'" cy="'+cy+'" r="26"/><text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle">'+top[0]+'</text><text x="'+cx+'" y="'+(cy+19)+'" text-anchor="middle">'+top[1]+'</text>'}var sel=0;function draw(){var s='';if(sel==0)s+='<rect x="70" y="50" width="210" height="200" style="fill:var(--c1)" opacity=".2"/>';if(sel==1)s+='<rect x="280" y="50" width="210" height="200" style="fill:var(--c3)" opacity=".2"/>';s+='<path class="sw" d="M70 50 H130 M210 50 H350 M430 50 H490 V124 M490 176 V250 H70 V176 M70 124 V50 M280 50 V110 M280 190 V250"/>';s+='<path class="sw" d="'+zh(130,210,50)+'"/><path class="sw" d="'+zh(350,430,50)+'"/><path class="sw" d="'+zv(280,110,190)+'"/>';s+=src(70,150,['+','−'])+src(490,150,['−','+']);s+='<circle cx="280" cy="50" r="6" style="fill:var(--text-primary)"/><circle cx="280" cy="250" r="6" style="fill:var(--text-primary)"/><path class="sw" d="M280 250 V262 M262 262 H298 M268 271 H292 M274 280 H286"/>';s+='<text x="294" y="42">a</text><text x="294" y="244">b</text><text x="306" y="278" style="font-size:18px !important;fill:var(--text-secondary)">toprak 0 V</text>';s+='<text x="170" y="32" text-anchor="middle">R₁ = 1 kΩ</text><text x="390" y="32" text-anchor="middle">R₂ = 2 kΩ</text><text x="300" y="156">R₃ = 2 kΩ</text><text x="104" y="104">V₁ = 6 V</text><text x="456" y="104" text-anchor="end">V₂ = 4 V</text>';s+=arc(175,205,24,'I₁')+arc(385,205,24,'I₂');$('g').innerHTML=s}function mm(a){return '<span class="mm">'+a.map(function(v){return '<span>'+String(v).replace('-','−')+'</span>'}).join('')+'</span>'}var T=[{n:'1 · Sol Göz',h:'<b>Sol göz (I₁, saat yönü)</b><br><span class="k">KGY: yükselme = düşümler</span><br>V₁ = R₁·I₁ + R₃·(I₁ − I₂)<br>6 = 1·I₁ + 2·(I₁ − I₂)<br><span class="r">3I₁ − 2I₂ = 6</span>'},{n:'2 · Sağ Göz',h:'<b>Sağ göz (I₂, saat yönü)</b><br><span class="k">R₃ ortak: I₂ yönünde akım I₂ − I₁</span><br>V₂ = R₂·I₂ + R₃·(I₂ − I₁)<br>4 = 2·I₂ + 2·(I₂ − I₁)<br><span class="r">−2I₁ + 4I₂ = 4</span>'},{n:'3 · Çözüm',h:'<b>Gauss</b><br>'+mm([3,-2,6,-2,4,4])+'<br><span class="k">R₁ + R₂ → R₁</span><br>'+mm([1,2,10,-2,4,4])+'<br><span class="k">R₂ + 2R₁ → R₂</span><br>'+mm([1,2,10,0,8,24])+'<br>8I₂ = 24 ⇒ <span class="r">I₂ = 3 mA</span>; I₁ + 2·3 = 10 ⇒ <span class="r">I₁ = 4 mA</span><br><span class="k">Güç dengesi: kaynaklar 6·4 + 4·3 = 36 mW; dirençler 1·4² + 2·3² + 2·1² = 16 + 18 + 2 = 36 mW ✓</span>'}];function show(k){sel=k;draw();$('bx').innerHTML=T[k].h;var c=$('tb').children;for(var i=0;i<c.length;i++)c[i].className=i==k?'on':''}$('tb').innerHTML=T.map(function(t,i){return '<div role="button" tabindex="0" data-k="'+i+'">'+t.n+'</div>'}).join('');var bs=$('tb').children;for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){show(+b.dataset.k)};b.onkeydown=function(e){if(e.key=='Enter'||e.key==' ')show(+b.dataset.k)}})(bs[i]);show(0)})()</script>
