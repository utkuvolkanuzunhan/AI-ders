<!-- W03 | Sabit eksenli doğru grafiği + kaydırıcı | Doğrusallaştırma, eğimden değer bulma -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w3 svg text,.w4 svg text{font-size:22px !important;font-weight:600}.w3{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding:6px;color:var(--text-primary)}.w3 .row{display:flex;justify-content:space-between;font-size:17px;color:var(--text-secondary);margin-top:14px}.w3 b{color:var(--text-primary)}.w3 input{width:100%}.w3 .k{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.w3 .k div{background:var(--surface-1);border-radius:10px;padding:12px}.w3 .k span{display:block;font-size:13px;color:var(--text-secondary)}.w3 .k b{font-size:21px}.w3 .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w3 .src{font-size:11px;color:var(--text-secondary);margin-top:12px}</style><div class='w3'><svg id='g' viewBox='0 0 560 320' width='100%'><defs><clipPath id='cp'><rect x='56' y='10' width='488' height='240'/></clipPath></defs></svg><div class='row'><span>Eₐ</span><b id='ev'></b></div><input id='e' type='range' min='20' max='120' value='50'><div class='k'><div><span>Eğim (K)</span><b id='sl'></b></div><div><span>Üçgenden Eₐ = −eğim·R</span><b id='eb'></b></div></div><div class='h'>Eksenler sabit. Ne yapacaksın: Eₐ'yı artır; doğru dikleşir, yani hız sıcaklığa daha duyarlı olur.</div><script>(function(){var $=function(i){return document.getElementById(i)},R=8.314,W=560,H=320,L=60,Rm=16,T=46,B=50,x0=.0026,x1=.0036,lo=-40,hi=20;var px=function(x){return L+(x-x0)/(x1-x0)*(W-L-Rm)},py=function(y){return T+(hi-y)/(hi-lo)*(H-T-B)};var base='<line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--border)" stroke-width="2"/><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-Rm)+'" y2="'+(H-B)+'" stroke="var(--border)" stroke-width="2"/>';for(var y=lo;y<=hi;y+=10)base+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+py(y)+'" y2="'+py(y)+'" stroke="var(--border)" opacity=".5"/><text class="t" x="'+(L-8)+'" y="'+(py(y)+5)+'" text-anchor="end">'+y+'</text>';for(var x=2.6;x<=3.61;x+=.2)base+='<text class="t" x="'+px(x/1000)+'" y="'+(H-B+22)+'" text-anchor="middle">'+x.toFixed(1)+'</text>';base+='<text class="t" x="'+W/2+'" y="'+(H-6)+'" text-anchor="middle">T⁻¹ · 10⁻³ (K⁻¹)</text><text class="th" x="4" y="20">ln k</text>';function u(){var E=+$('e').value,m=-E*1000/R,A=20;$('ev').textContent=E+' kJ/mol';var yv=function(x){return A+m*x};var s='<defs><clipPath id="cp"><rect x="'+L+'" y="'+T+'" width="'+(W-L-Rm)+'" height="'+(H-T-B)+'"/></clipPath></defs>'+base+'<g clip-path="url(#cp)"><line x1="'+px(x0)+'" y1="'+py(yv(x0))+'" x2="'+px(x1)+'" y2="'+py(yv(x1))+'" style="stroke:var(--c1)" stroke-width="4" stroke-linecap="round"/></g>';var xa=.0029,xb=.0033,ya=yv(xa),yb=yv(xb);s+='<path d="M'+px(xa)+','+py(ya)+' H'+px(xb)+' V'+py(yb)+'" fill="none" style="stroke:var(--c3)" stroke-width="3" stroke-dasharray="5 4"/><circle cx="'+px(xa)+'" cy="'+py(ya)+'" r="7" style="fill:var(--c2)"/><circle cx="'+px(xb)+'" cy="'+py(yb)+'" r="7" style="fill:var(--c2)"/><text class="th" x="'+(px(xa)+px(xb))/2+'" y="'+(py(ya)-12)+'" text-anchor="middle" style="fill:var(--c3)">Δ(T⁻¹)</text><text class="th" x="'+(px(xb)+10)+'" y="'+(py(ya)+py(yb))/2+'" style="fill:var(--c3)">Δ ln k</text>';$('g').innerHTML=s;$('sl').textContent=Math.round(m)+' K';$('eb').textContent=((yb-ya)/(xb-xa)*-R/1000).toFixed(1)+' kJ/mol'}$('e').oninput=u;u()})()</script></div>
