<!-- W04 | Sabit eksenli eğri + iki nokta | Bir değişkenin etkisi, iki durum karşılaştırma -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w3 svg text,.w4 svg text{font-size:22px !important;font-weight:600}.w4{-webkit-text-size-adjust:100%;text-size-adjust:100%;padding:6px;color:var(--text-primary)}.w4 .row{display:flex;justify-content:space-between;font-size:17px;color:var(--text-secondary);margin-top:14px}.w4 b{color:var(--text-primary)}.w4 input{width:100%}.w4 .k{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.w4 .k div{background:var(--surface-1);border-radius:10px;padding:12px}.w4 .k span{display:block;font-size:13px;color:var(--text-secondary)}.w4 .k b{font-size:22px}.w4 .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w4 .src{font-size:11px;color:var(--text-secondary);margin-top:12px}</style><div class='w4'><svg id='g' viewBox='0 0 560 300' width='100%'></svg><div class='row'><span>Eₐ</span><b id='av'></b></div><input id='e' type='range' min='20' max='100' value='50'><div class='row'><span>T₁</span><b id='bv'></b></div><input id='t1' type='range' min='20' max='90' value='63'><div class='row'><span>T₂</span><b id='cv'></b></div><input id='t2' type='range' min='20' max='120' value='72'><div class='k'><div><span>ln (oran)</span><b id='l'></b></div><div><span>Oran: k₂, k₁'in kaç katı</span><b id='r' style='color:var(--c3)'></b></div></div><div class='h'>Eksenler sabit; eğri üst sınırı aşarsa kırpılır. Ne yapacaksın: Eₐ'yı 100'e çıkar; aynı 63→72 °C artışında oran 1,6'dan yaklaşık 2,5'e fırlar.</div><script>(function(){var $=function(i){return document.getElementById(i)},R=8.314,W=560,H=300,L=56,Rm=16,T=46,B=50,cm=140,mx=30;var px=function(c){return L+c/cm*(W-L-Rm)},py=function(v){return T+(1-v/mx)*(H-T-B)};var base='<defs><clipPath id="cp"><rect x="'+L+'" y="'+T+'" width="'+(W-L-Rm)+'" height="'+(H-T-B)+'"/></clipPath></defs><line x1="'+L+'" y1="'+T+'" x2="'+L+'" y2="'+(H-B)+'" stroke="var(--border)" stroke-width="2"/><line x1="'+L+'" y1="'+(H-B)+'" x2="'+(W-Rm)+'" y2="'+(H-B)+'" stroke="var(--border)" stroke-width="2"/>';for(var v=0;v<=mx;v+=10)base+='<line x1="'+L+'" x2="'+(W-Rm)+'" y1="'+py(v)+'" y2="'+py(v)+'" stroke="var(--border)" opacity=".5"/><text class="t" x="'+(L-8)+'" y="'+(py(v)+5)+'" text-anchor="end">'+v+'</text>';for(var c=0;c<=cm;c+=20)base+='<text class="t" x="'+px(c)+'" y="'+(H-B+22)+'" text-anchor="middle">'+c+'</text>';base+='<text class="t" x="'+W/2+'" y="'+(H-6)+'" text-anchor="middle">Sıcaklık (°C)</text><text class="th" x="4" y="20">Hız oranı (kat)</text>';function u(){var E=+$('e').value,c1=+$('t1').value,c2=+$('t2').value;$('av').textContent=E+' kJ/mol';$('bv').textContent=c1+' °C';$('cv').textContent=c2+' °C';var k=function(c){return Math.exp(-E*1000/(R*(c+273.15)))},k1=k(c1),l=E*1000/R*(1/(c1+273.15)-1/(c2+273.15));$('l').textContent=l.toFixed(3);$('r').textContent=Math.exp(l).toFixed(2)+' kat';var d='';for(var c=0;c<=cm;c+=5)d+=(c?'L':'M')+px(c)+','+py(k(c)/k1);var s=base+'<g clip-path="url(#cp)"><path d="'+d+'" fill="none" style="stroke:var(--c1)" stroke-width="4" stroke-linecap="round"/></g>';[[c1,'var(--c2)','T₁'],[c2,'var(--c3)','T₂']].forEach(function(a){var vv=Math.min(k(a[0])/k1,mx);s+='<line x1="'+px(a[0])+'" x2="'+px(a[0])+'" y1="'+(H-B)+'" y2="'+py(vv)+'" style="stroke:'+a[1]+'" stroke-dasharray="4 4"/><circle cx="'+px(a[0])+'" cy="'+py(vv)+'" r="8" style="fill:'+a[1]+'"/><text class="th" x="'+px(a[0])+'" y="'+(py(vv)+(vv>mx*.85?28:-14))+'" text-anchor="middle" style="fill:'+a[1]+'">'+a[2]+'</text>'});$('g').innerHTML=s}['e','t1','t2'].forEach(function(i){$(i).oninput=u});u()})()</script></div>
