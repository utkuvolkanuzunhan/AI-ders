<!-- W22 | Ters matris, Gauss–Jordan adım adım | A ve I yan yana yazılıp A sol yarıda I olana kadar indirgenir; her adımda tek satır işlemi, değişen satır turuncu, öncü 1 yeşil (ST dizisi veridir: matris 3×6, işlem, açıklama, değişen satırlar, öncüler). Sol yarıda sıfır satır çıkarsa tekil durumu için ST yeniden yazılır -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w5,.w5 *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w5{color:var(--text-primary);padding:6px}.w5 [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.w5 .ph{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}.w5 .ph span{padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--c4) 22%,transparent);color:var(--text-primary)}.w5 .ph .dots{display:flex;gap:5px;margin-left:auto}.w5 .ph .dots i{width:10px;height:10px;border-radius:99px;background:var(--border)}.w5 .ph .dots i.d{background:var(--c1)}.w5 .mx{display:grid;grid-template-columns:26px repeat(6,1fr);column-gap:3px}.w5 .rl{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-secondary)}.w5 .cw{padding:2px 0}.w5 .cw.l{border-left:4px solid var(--text-primary);padding-left:2px}.w5 .cw.r{border-right:4px solid var(--text-primary);padding-right:2px}.w5 .cw.s{border-left:3px dashed var(--text-secondary);padding-left:3px}.w5 .hd{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-secondary);padding-bottom:2px}.w5 .hd.a{grid-column:2 / span 3}.w5 .hd.i{grid-column:5 / span 3}.w5 .cb{min-height:40px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;border-radius:8px;background:var(--surface-1);border:2px solid var(--border)}.w5 .cb.b{background:color-mix(in srgb,var(--c3) 26%,transparent);border-color:var(--c3)}.w5 .cb.p{border-color:var(--c2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 35%,transparent);background:color-mix(in srgb,var(--c2) 24%,transparent)}.w5 .op{text-align:center;font-size:19px;font-weight:800;margin:12px 0 6px;color:var(--c4);min-height:28px}.w5 .wy{padding:10px 14px;font-size:16px;line-height:1.45;border-radius:12px;background:var(--surface-1);border-left:8px solid var(--c1);min-height:64px}.w5 .nv{display:flex;gap:10px;margin-top:12px}.w5 .nv [role=button]{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;border-radius:12px;border:2px solid var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}.w5 .nv [role=button].off{opacity:.35;pointer-events:none}.w5 .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}</style><div class='w5'><div class='ph'><span id='ph'></span><div class='dots' id='dots'></div></div><div class='mx' id='mx'></div><div class='op' id='op'></div><div class='wy' id='wy'></div><div class='nv'><div role='button' tabindex='0' id='pv'>◀ Geri</div><div role='button' tabindex='0' id='nx'>İleri ▶</div></div><div class='h'>Ne yapacaksın, ne göreceksin: İleri'ye bas; her adımda tek satır işlemi hem sol (A) hem sağ (I) yarıya uygulanır. Turuncu satır değişeni, yeşil kutu öncü 1'i gösterir. Sonda sağ yarı A⁻¹ olur.</div></div><script>(function(){var $=function(i){return document.getElementById(i)};function n(v){return String(v).replace('-','−')}var ST=[{"m": [[1, 2, 3, 1, 0, 0], [2, 5, 3, 0, 1, 0], [1, 0, 8, 0, 0, 1]], "op": "Başlangıç: [A | I]", "why": "Soldaki A matrisinin yanına birim matris yazıldı. Hedef: sol tarafı I yapmak. İşlemler sağ tarafa da uygulanır; sonunda orada A⁻¹ kalır.", "b": [], "p": [[0, 0]]}, {"m": [[1, 2, 3, 1, 0, 0], [0, 1, -3, -2, 1, 0], [1, 0, 8, 0, 0, 1]], "op": "R₂ − 2R₁ → R₂", "why": "1. sütunda öncü 1 hazır. 2. satırdaki 2'yi sıfırla; satırın tamamı (6 sayı) değişir.", "b": [1], "p": [[0, 0]]}, {"m": [[1, 2, 3, 1, 0, 0], [0, 1, -3, -2, 1, 0], [0, -2, 5, -1, 0, 1]], "op": "R₃ − R₁ → R₃", "why": "3. satırdaki 1'i sıfırla. 1. sütun tamam.", "b": [2], "p": [[0, 0]]}, {"m": [[1, 2, 3, 1, 0, 0], [0, 1, -3, -2, 1, 0], [0, 0, -1, -5, 2, 1]], "op": "R₃ + 2R₂ → R₃", "why": "2. sütunda öncü 1 hazır (2. satır). 3. satırdaki −2'yi sıfırla.", "b": [2], "p": [[0, 0], [1, 1]]}, {"m": [[1, 2, 3, 1, 0, 0], [0, 1, -3, -2, 1, 0], [0, 0, 1, 5, -2, -1]], "op": "−R₃ → R₃", "why": "3. satırın öncü sayısı −1. Satırı −1 ile çarp: öncü 1 olur.", "b": [2], "p": [[0, 0], [1, 1], [2, 2]]}, {"m": [[1, 2, 3, 1, 0, 0], [0, 1, 0, 13, -5, -3], [0, 0, 1, 5, -2, -1]], "op": "R₂ + 3R₃ → R₂", "why": "Şimdi yukarı doğru temizle: 2. satırdaki −3'ü sıfırla.", "b": [1], "p": [[0, 0], [1, 1], [2, 2]]}, {"m": [[1, 2, 0, -14, 6, 3], [0, 1, 0, 13, -5, -3], [0, 0, 1, 5, -2, -1]], "op": "R₁ − 3R₃ → R₁", "why": "1. satırda 3. sütundaki 3'ü sıfırla.", "b": [0], "p": [[0, 0], [1, 1], [2, 2]]}, {"m": [[1, 0, 0, -40, 16, 9], [0, 1, 0, 13, -5, -3], [0, 0, 1, 5, -2, -1]], "op": "R₁ − 2R₂ → R₁", "why": "Son sıfırlama: 1. satırda 2. sütundaki 2. Sol taraf I oldu; sağ taraf A⁻¹. Kontrol: 1·(−40) + 2·13 + 3·5 = 1.", "b": [0], "p": [[0, 0], [1, 1], [2, 2]]}];var k=0;function draw(){var s=ST[k],m=s.m,h='<div class="hd a">A</div><div class="hd i">I → A⁻¹</div>';for(var i=0;i<3;i++){h+='<div class="rl">R'+(i+1)+'</div>';for(var j=0;j<6;j++){var c='cb';if(s.b.indexOf(i)>=0)c+=' b';if(s.p.some(function(q){return q[0]==i&&q[1]==j}))c+=' p';h+='<div class="cw'+(j==0?' l':'')+(j==3?' s':'')+(j==5?' r':'')+'"><div class="'+c+'">'+n(m[i][j])+'</div></div>'}}$('mx').innerHTML=h;$('op').textContent=s.op;$('wy').textContent=s.why;$('ph').textContent=k==0?'Başlangıç':(k==ST.length-1?'Sonuç':'Adım '+k+' / '+(ST.length-1));var d='';for(var i=0;i<ST.length;i++)d+='<i'+(i<=k?' class="d"':'')+'></i>';$('dots').innerHTML=d;$('pv').className=k==0?'off':'';$('nx').className=k==ST.length-1?'off':''}function go(d){k=Math.max(0,Math.min(ST.length-1,k+d));draw()}$('nx').onclick=function(){go(1)};$('pv').onclick=function(){go(-1)};$('nx').onkeydown=function(e){if(e.key=='Enter'||e.key==' ')go(1)};$('pv').onkeydown=function(e){if(e.key=='Enter'||e.key==' ')go(-1)};draw()})()</script>
