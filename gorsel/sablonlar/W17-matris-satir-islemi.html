<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w5,.w5 *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w5{color:var(--text-primary);padding:6px}.w5 [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.w5 .ph{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin-bottom:8px}.w5 .ph span{padding:5px 10px;border-radius:99px;background:color-mix(in srgb,var(--c4) 22%,transparent);color:var(--text-primary)}.w5 .ph .dots{display:flex;gap:5px;margin-left:auto}.w5 .ph .dots i{width:10px;height:10px;border-radius:99px;background:var(--border)}.w5 .ph .dots i.d{background:var(--c1)}.w5 .mx{display:grid;grid-template-columns:34px repeat(4,1fr);column-gap:5px}.w5 .rl{display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--text-secondary)}.w5 .cw{padding:2px 0}.w5 .cw.l{border-left:4px solid var(--text-primary);padding-left:3px}.w5 .cw.r{border-right:4px solid var(--text-primary);padding-right:3px}.w5 .cw.s{border-left:3px dashed var(--text-secondary);padding-left:4px}.w5 .cb{min-height:42px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;border-radius:8px;background:var(--surface-1);border:2px solid var(--border)}.w5 .cb.b{background:color-mix(in srgb,var(--c3) 26%,transparent);border-color:var(--c3)}.w5 .cb.p{border-color:var(--c2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 35%,transparent);background:color-mix(in srgb,var(--c2) 24%,transparent)}.w5 .op{text-align:center;font-size:19px;font-weight:800;margin:12px 0 6px;color:var(--c4);min-height:28px}.w5 .wy{padding:10px 14px;font-size:16px;line-height:1.45;border-radius:12px;background:var(--surface-1);border-left:8px solid var(--c1);min-height:64px}.w5 .nv{display:flex;gap:10px;margin-top:12px}.w5 .nv [role=button]{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;border-radius:12px;border:2px solid var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}.w5 .nv [role=button].off{opacity:.35;pointer-events:none}.w5 .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}</style><div class='w5'><div class='ph'><span id='ph'></span><div class='dots' id='dots'></div></div><div class='mx' id='mx'></div><div class='op' id='op'></div><div class='wy' id='wy'></div><div class='nv'><div role='button' tabindex='0' id='pv'>◀ Geri</div><div role='button' tabindex='0' id='nx'>İleri ▶</div></div><div class='h'>Ne yapacaksın, ne göreceksin: İleri'ye bas; her adımda tek satır işlemi uygulanır, turuncu satır değişeni, yeşil kutu öncü 1'i gösterir.</div></div><script>(function(){var $=function(i){return document.getElementById(i)};function n(v){return String(v).replace('-','−')}var M0=[[1,1,2,9],[2,4,-3,1],[3,6,-5,0]];var ST=[{f:function(m){},op:'Başlangıç matrisi',why:'Genişletilmiş matris. 1. sütunda öncü 1 hazır: (1, 1) konumundaki 1.',b:[],p:[[0,0]],ph:0},{f:function(m){m[1]=m[1].map(function(v,j){return v-2*m[0][j]})},op:'R₂ − 2R₁ → R₂',why:'Öncü 1\'in altındaki 2\'yi sıfırla: (2, 4, −3, 1) − 2·(1, 1, 2, 9).',b:[1],p:[[0,0]],ph:0},{f:function(m){m[2]=m[2].map(function(v,j){return v-3*m[0][j]})},op:'R₃ − 3R₁ → R₃',why:'Aynı sütunda 3\'ü sıfırla: (3, 6, −5, 0) − 3·(1, 1, 2, 9). 1. sütun bitti.',b:[2],p:[[0,0]],ph:0},{f:function(m){m[2]=m[2].map(function(v,j){return v-m[1][j]})},op:'R₃ − R₂ → R₃',why:'Alt matriste 2 ve 3 var. 3 − 2 = 1 ile kesirsiz bir 1 üretiyoruz.',b:[2],p:[[0,0]],ph:0},{f:function(m){var t=m[1];m[1]=m[2];m[2]=t},op:'R₂ ↔ R₃',why:'1\'i 2. satıra çıkar: 2. sütunun öncü 1\'i hazır.',b:[1,2],p:[[0,0],[1,1]],ph:0},{f:function(m){m[2]=m[2].map(function(v,j){return v-2*m[1][j]})},op:'R₃ − 2R₂ → R₃',why:'2. sütunda öncü 1\'in altındaki 2\'yi sıfırla. Son satırda öncü 1 kendiliğinden çıktı: satır eşelon form!',b:[2],p:[[0,0],[1,1],[2,2]],ph:0},{f:function(m){},op:'Geri yerine koyma: 3. satır',why:'3. satır x₃ = 3 der.',b:[2],p:[[0,0],[1,1],[2,2]],ph:1},{f:function(m){},op:'Geri yerine koyma: 2. satır',why:'x₂ − 4x₃ = −10 ⇒ x₂ = −10 + 4·3 = 2.',b:[1],p:[[0,0],[1,1],[2,2]],ph:1},{f:function(m){},op:'Geri yerine koyma: 1. satır',why:'x₁ + x₂ + 2x₃ = 9 ⇒ x₁ = 9 − 2 − 2·3 = 1. Çözüm: (x₁, x₂, x₃) = (1, 2, 3).',b:[0],p:[[0,0],[1,1],[2,2]],ph:1}];var k=0;function mats(k){var m=M0.map(function(r){return r.slice()});for(var i=1;i<=k&&i<=5;i++)ST[i].f(m);return m}function draw(){var s=ST[k],m=mats(k),h='';for(var i=0;i<3;i++){h+='<div class="rl">R'+(i+1)+'</div>';for(var j=0;j<4;j++){var c='cb';if(s.b.indexOf(i)>=0)c+=' b';if(s.p.some(function(q){return q[0]==i&&q[1]==j}))c+=' p';h+='<div class="cw'+(j==0?' l':'')+(j==3?' r s':'')+'"><div class="'+c+'">'+n(m[i][j])+'</div></div>'}}$('mx').innerHTML=h;$('op').textContent=s.op;$('wy').textContent=s.why;$('ph').textContent=s.ph?'Geri yerine koyma':'İleri yok etme';var d='';for(var i=0;i<ST.length;i++)d+='<i'+(i<=k?' class="d"':'')+'></i>';$('dots').innerHTML=d;$('pv').className=k==0?'off':'';$('nx').className=k==ST.length-1?'off':''}function go(d){k=Math.max(0,Math.min(ST.length-1,k+d));draw()}$('nx').onclick=function(){go(1)};$('pv').onclick=function(){go(-1)};$('nx').onkeydown=function(e){if(e.key=='Enter'||e.key==' ')go(1)};$('pv').onkeydown=function(e){if(e.key=='Enter'||e.key==' ')go(-1)};draw()})()</script>
