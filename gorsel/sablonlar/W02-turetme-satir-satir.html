<!-- W02 | Satır satır türetme | Formül nereden geliyor; her tıkta bir satır ve kuralı -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.dv{-webkit-text-size-adjust:100%;text-size-adjust:100%;color:var(--text-primary);font-family:inherit;padding:6px}.dv .st{display:none;background:var(--surface-1);border-radius:12px;padding:26px 12px 20px;margin-top:16px;font-size:clamp(20px,6vw,30px);font-weight:700;text-align:center;line-height:1.3}.dv .st.on{display:block}.dv .st small{display:block;font-size:15px;font-weight:400;color:var(--text-secondary);margin-top:16px;line-height:1.4}.dv .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;line-height:1.2}.dv .fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .15em .1em}.dv .fr>span:last-child{padding-top:.1em}.dv .eb{display:inline-grid;grid-template-columns:auto auto;align-items:end;vertical-align:bottom}.dv .eb .e{grid-column:1;grid-row:2}.dv .eb .ex{grid-column:2;grid-row:1;font-size:.7em;margin:0 0 .3em .1em;display:inline-flex;align-items:center;gap:.1em}.dv .bt{display:flex;gap:10px;margin-top:16px}.dv [role=button]{text-align:center;flex:1;border:2px solid var(--border);background:var(--surface-1);color:var(--text-primary);border-radius:12px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}.dv .src{font-size:11px;color:var(--text-secondary);margin-top:16px}</style><div class='dv'><div class='st on'>k = A · <span class='eb'><span class='e'>e</span><span class='ex'>−<span class='fr'><span>E<sub>a</sub></span><span>RT</span></span></span></span><small>Başlangıç: Arrhenius denklemi.</small></div><div class='st'>ln k = ln A + ln <span class='eb'><span class='e'>e</span><span class='ex'>−<span class='fr'><span>E<sub>a</sub></span><span>RT</span></span></span></span><small>Kural: ln(a·b) = ln a + ln b</small></div><div class='st'>ln k = ln A − <span class='fr'><span>E<sub>a</sub></span><span>R</span></span> · <span class='fr'><span>1</span><span>T</span></span><small>Kural: ln eˣ = x</small></div><div class='st' style='color:var(--c1)'>y = b + m · x<small style='color:var(--text-secondary)'>y = ln k · x = <span class='fr'><span>1</span><span>T</span></span> · eğim m = −<span class='fr'><span>Eₐ</span><span>R</span></span> · kesim b = ln A</small></div><div class='bt'><div role='button' tabindex='0' id='n'>Sonraki satır</div><div role='button' tabindex='0' id='r'>Sıfırla</div></div><script>(function(){var s=document.querySelectorAll('.dv .st'),i=0;function u(){s.forEach(function(e,j){e.className='st'+(j<=i?' on':'')})}document.getElementById('n').onclick=function(){i=Math.min(3,i+1);u()};document.getElementById('r').onclick=function(){i=0;u()};u()})()</script></div>
