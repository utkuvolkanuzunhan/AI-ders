<!-- W07 | Sınıflama ağacı (ikonlu) | Sınıflar ve alt türler; dokununca renkli ayrıntı paneli -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.w .root{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto;width:64%;padding:14px 8px;border-radius:16px;font-size:22px;font-weight:800;background:var(--surface-1);border:3px solid var(--border)}
.w svg.cn{display:block;width:100%;height:30px}.w svg.cn line{stroke:var(--border);stroke-width:3}
.w .cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.w .nd{text-align:center;padding:12px 2px 10px;border-radius:16px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);transition:background .2s,transform .2s,box-shadow .2s}
.w .nd .ic{font-size:30px;line-height:1.1}.w .nd .nm{font-size:18px;font-weight:800;margin-top:4px}.w .nd .sm{font-size:13px;color:var(--text-secondary);margin-top:2px}
.w .nd.on{background:color-mix(in srgb,var(--c) 38%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-2px)}
.w .p{margin-top:16px;border-radius:16px;overflow:hidden;background:var(--surface-1);border:3px solid var(--c)}
.w .p .hd{padding:14px 16px;background:color-mix(in srgb,var(--c) 30%,transparent)}.w .p .hd b{display:block;font-size:21px}.w .p .hd span{display:block;font-size:16px;margin-top:4px;line-height:1.35}
.w .p .it{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);font-size:17px;line-height:1.3}.w .p .it i{font-style:normal;font-size:26px;width:34px;text-align:center;flex:none}
@media (prefers-reduced-motion:reduce){.w .nd{transition:none}}
</style>
<div class='w'><div class='root'>🧬 Lipitler</div><svg class='cn' viewBox='0 0 300 30' preserveAspectRatio='none'><line x1='150' y1='0' x2='150' y2='14' vector-effect='non-scaling-stroke'/><line x1='50' y1='14' x2='250' y2='14' vector-effect='non-scaling-stroke'/><line x1='50' y1='14' x2='50' y2='30' vector-effect='non-scaling-stroke'/><line x1='150' y1='14' x2='150' y2='30' vector-effect='non-scaling-stroke'/><line x1='250' y1='14' x2='250' y2='30' vector-effect='non-scaling-stroke'/></svg><div class='cats' id='n'></div><div class='p c1' id='p'></div><div class='h'>Ne yapacaksın: üç sınıfa sırayla dokun. Ne göreceksin: her sınıfın yapısı ve içindeki örnekler.</div></div>
<script>(function(){var D=[['c1','🫒','Basit','yağ + alkol','Basit Lipitler (Simple Lipids)','Yağ asidi + alkol: yalnız ester.',[['🫒','Triaçilgliseroller: yağlar ve sıvı yağlar'],['🐝','Mumlar: uzun zincirli alkol + yağ asidi']]],['c2','🥚','Bileşik','+ ek grup','Bileşik Lipitler (Compound Lipids)','Yağ asidi + alkol + fosfat, şeker ya da protein.',[['🥚','Fosfolipitler: lesitin'],['🍬','Glikolipitler'],['🧱','Lipoproteinler']]],['c3','🧪','Türev','parçalar','Türev Lipitler (Derived Lipids)','Hidroliz ürünleri ya da lipit gibi davrananlar.',[['🔬','Yağ asitleri, gliserol'],['🧈','Steroller: kolesterol'],['☀️','Vitamin A, D, E, K']]]],n=document.getElementById('n'),p=document.getElementById('p'),h='';D.forEach(function(d,i){h+='<div role="button" tabindex="0" class="nd '+d[0]+'"><div class="ic">'+d[1]+'</div><div class="nm">'+d[2]+'</div><div class="sm">'+d[3]+'</div></div>'});n.innerHTML=h;var ns=n.children;function sel(i){var d=D[i];for(var k=0;k<ns.length;k++)ns[k].classList.toggle('on',k==i);var s='<div class="hd"><b>'+d[4]+'</b><span>'+d[5]+'</span></div>';d[6].forEach(function(c){s+='<div class="it"><i>'+c[0]+'</i><span>'+c[1]+'</span></div>'});p.className='p '+d[0];p.innerHTML=s}for(var k=0;k<ns.length;k++)(function(k){ns[k].onclick=function(){sel(k)}})(k);sel(0)})()</script>
