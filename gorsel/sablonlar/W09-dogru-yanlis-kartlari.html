<!-- W09 | Doğru/yanlış kartları | Tuzak kontrolü; dokununca kart renklenir ve açıklama çıkar -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.w .cd{display:flex;gap:12px;align-items:flex-start;margin-top:10px;min-height:76px;padding:14px;border-radius:14px;border:3px solid var(--border);background:var(--surface-1);font-size:17px;line-height:1.35;transition:background .2s,border-color .2s}
.w .cd .bd{flex:none;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;border:2px dashed var(--border);color:var(--text-secondary)}
.w .cd .v{display:none;margin-top:8px;font-size:16px;font-weight:600}.w .cd.on .v{display:block}.w .cd small{display:block;font-size:14px;color:var(--text-secondary);margin-top:4px}.w .cd.on small{display:none}
.w .cd.ok{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 16%,transparent)}.w .cd.ok .bd{border:0;background:var(--c2);color:#fff}
.w .cd.no{border-color:var(--c3);background:color-mix(in srgb,var(--c3) 16%,transparent)}.w .cd.no .bd{border:0;background:var(--c3);color:#fff}
.w .sc{margin-top:12px;font-size:15px;color:var(--text-secondary);text-align:right}
</style>
<div class='w' id='w'></div>
<script>(function(){var Q=[['Lipitler suda çözünür, eterde çözünmez.',0,'Tuzak: tersi. Lipitler suda çözünmez, eter ve hekzanda çözünür.'],['Lesitin bileşik lipittir.',1,'Doğru: fosfat taşır.'],['Kolesterol bir esterdir, bu yüzden basit lipittir.',0,'Tuzak: kolesterol ester değil, türev lipittir.'],['Oda sıcaklığında sıvı lipite "katı yağ (fat)" denir.',0,'Tuzak: sıvı olan sıvı yağ (oil), katı olan katı yağ (fat).']],w=document.getElementById('w'),h='',n=0;Q.forEach(function(q,i){h+='<div role="button" tabindex="0" class="cd" data-i="'+i+'"><div class="bd">?</div><div>'+q[0]+'<small>Doğru mu, tuzak mı? Dokun 👆</small><span class="v"></span></div></div>'});w.innerHTML=h+'<div class="sc" id="sc">0 / '+Q.length+' açıldı</div><div class="h">Ne yapacaksın: kartlara dokun. Ne göreceksin: yeşil ✓ doğru, turuncu ✗ tuzak; altında nedeni.</div>';w.querySelectorAll('.cd').forEach(function(c){c.onclick=function(){if(c.classList.contains('on'))return;var q=Q[+c.dataset.i];c.classList.add('on',q[1]?'ok':'no');c.querySelector('.bd').textContent=q[1]?'✓':'✗';c.querySelector('.v').textContent=q[2];n++;document.getElementById('sc').textContent=n+' / '+Q.length+' açıldı'}})})()</script>
