<!-- W10 | Mini test | Konu/blok sonu 3 soru; anında geri bildirim, ilerleme çubuğu, sonuç -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.w .pg{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-secondary);margin-bottom:10px}.w .pg .bar{flex:1;height:8px;border-radius:99px;background:var(--surface-1);overflow:hidden}.w .pg .bar i{display:block;height:100%;background:var(--c1);border-radius:99px;transition:width .3s}
.w .qt{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:10px}
.w .o{display:flex;gap:10px;align-items:center;margin-top:8px;min-height:52px;padding:12px 14px;font-size:17px;font-weight:600;border-radius:12px;border:2px solid var(--border);background:var(--surface-1)}.w .o .l{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;background:color-mix(in srgb,var(--c1) 18%,transparent)}
.w .o.ok{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 20%,transparent)}.w .o.ok .l{background:var(--c2);color:#fff}.w .o.no{border-color:var(--c3);background:color-mix(in srgb,var(--c3) 20%,transparent)}.w .o.no .l{background:var(--c3);color:#fff}
.w .ex{display:none;margin-top:10px;font-size:16px;line-height:1.45;background:var(--surface-1);border-radius:12px;padding:12px 14px;border-left:6px solid var(--c1)}
.w .nx{display:none;text-align:center;margin-top:12px;padding:14px;font-size:17px;font-weight:700;border-radius:12px;border:2px solid var(--c1);background:color-mix(in srgb,var(--c1) 16%,transparent)}
.w .sc{text-align:center;padding:22px 0}.w .sc b{display:block;font-size:44px;font-weight:800}.w .sc span{font-size:16px;color:var(--text-secondary)}
</style>
<div class='w' id='w'></div>
<script>(function(){var Q=[['Tam hidrolizde gliserol, 2 yağ asidi, fosfat ve kolin veren lipit hangisidir?',['Triaçilgliserol','Fosfolipit (bileşik)','Mum','Türev lipit'],1,'Fosfat ve kolin ek gruptur: bileşik. Yağ asidi 2 olduğu için triaçilgliserol olamaz.'],['1 mol triaçilgliserol esterleşmeyle oluşurken ne çıkar?',['1 mol su, eter bağı','3 mol su, ester bağı','3 mol su, peptit bağı','2 mol su, ester bağı'],1,'3 OH grubu 3 yağ asidine bağlanır: 3 ester bağı, 3 su.'],['Hidrolizde yalnız yağ asidi ve uzun zincirli alkol çıkıyor, gliserol yok. Bu lipit?',['Triaçilgliserol','Fosfolipit','Mum','Karotenoid'],2,'Mum, uzun zincirli alkolün esteridir; gliserol yoksa triaçilgliserol değildir.']],i=0,s=0,w=document.getElementById('w');function show(){if(i>=Q.length){w.innerHTML='<div class="sc"><b>'+s+' / '+Q.length+'</b><span>'+(s==Q.length?'Tamamı doğru 🎉':'Yanlışlarını bir daha oku 💪')+'</span></div>';return}var q=Q[i],h='<div class="pg">Soru '+(i+1)+' / '+Q.length+'<div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div></div><div class="qt">'+q[0]+'</div>';q[1].forEach(function(o,j){h+='<div role="button" tabindex="0" class="o" data-j="'+j+'"><span class="l">'+String.fromCharCode(65+j)+'</span>'+o+'</div>'});h+='<div class="ex" id="ex"></div><div role="button" tabindex="0" class="nx" id="nx">'+(i==Q.length-1?'Sonucu gör':'Sonraki soru')+'</div>';w.innerHTML=h;var bs=w.querySelectorAll('.o'),done=0;bs.forEach(function(b){b.onclick=function(){if(done)return;done=1;var j=+b.dataset.j;if(j==q[2])s++;b.classList.add(j==q[2]?'ok':'no');bs[q[2]].classList.add('ok');var e=document.getElementById('ex');e.style.display='block';e.textContent=q[3];document.getElementById('nx').style.display='block'}});document.getElementById('nx').onclick=function(){i++;show()}}show()})()</script>
