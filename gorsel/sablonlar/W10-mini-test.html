<!-- W10 | Mini test / tek soru / tam test | Anlatım içi soru: 1 soru, mini test (2-3 soru alt alta) ya da tam test (4+ soru tek tek, ilerleme şeritli); İngilizce soru ve şıklar, Türkçesi parantez içinde ayrı satırda; anında doğru/yanlış, İpucu, açıklama, sonuç -->
<style>:root{--c1:#6F82E6;--c2:#45B39D;--c3:#E0924A}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}
.w{max-width:760px;margin:0 auto;padding:4px 2px 10px;color:var(--text-primary);font-family:inherit;font-size:16px;line-height:1.5}
.w [role=button]{cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.w [role=button]:focus-visible{outline:3px solid var(--c1);outline-offset:2px}
.w sup,.w sub{font-size:.8em;line-height:0}.w .sb{display:inline-block;font-size:.86em;line-height:1;transform:translateY(-.7em);margin-left:1px;font-weight:700}
.w .sg{display:flex;gap:4px;margin:0 0 14px}.w .sg i{flex:1;height:10px;border-radius:5px;background:var(--surface-1);border:1px solid var(--border)}.w .sg i.ok{background:var(--c2);border-color:var(--c2)}.w .sg i.no{background:var(--c3);border-color:var(--c3)}.w .sg i.cu{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1)}
.w .qc{margin-top:26px}.w .qc:first-child{margin-top:4px}.w .sg+.qc{margin-top:8px}.w .ql{font-size:14px;font-weight:600;color:var(--text-secondary)}.w .qe{font-size:22px;font-weight:700;line-height:1.4;margin-top:6px}.w .qr{font-size:16px;color:var(--text-secondary);line-height:1.5;margin-top:8px}
/* şıklar: çizgili satırlar, harf soluk, İngilizce kalın, Türkçe altta soluk; cevaptan sonra yalnız doğru ve seçilen yanlış renkli */
.w .os{margin-top:16px;border-top:1px solid var(--border)}.w .o{display:flex;align-items:center;gap:14px;min-height:72px;padding:16px 8px 16px 16px;border-bottom:1px solid var(--border)}.w .o .l{flex:none;width:26px;font-size:20px;font-weight:800;color:var(--text-secondary)}.w .o .x{flex:1;min-width:0}.w .o .en{display:block;font-size:17px;font-weight:600;line-height:1.4}.w .o .tr{display:block;font-size:15px;color:var(--text-secondary);line-height:1.4;margin-top:3px}.w .o .mk{flex:none;width:28px;height:28px;display:none}.w .o .mk svg{display:block;width:28px;height:28px}
.w .o.ok{background:rgba(69,179,157,.14);box-shadow:inset 5px 0 0 var(--c2)}.w .o.no{background:rgba(224,146,74,.14);box-shadow:inset 5px 0 0 var(--c3)}.w .o.ok .l,.w .o.no .l{color:var(--text-primary)}.w .o.ok .mk,.w .o.no .mk{display:block}.w .o.ok .mk{color:var(--c2)}.w .o.no .mk{color:var(--c3)}.w .o.dn{opacity:.5}
.w .hn{display:inline-flex;align-items:center;margin-top:14px;padding:0 16px;min-height:44px;border-radius:99px;border:1px solid var(--border);font-size:15px;font-weight:600}.w .ht{display:none;margin-top:10px;padding:4px 0 4px 14px;border-left:3px solid var(--c1);font-size:16px;line-height:1.5}
.w .bn{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:18px;font-weight:800;line-height:1.3}.w .bn svg{flex:none;width:26px;height:26px}.w .bn.ok svg{color:var(--c2)}.w .bn.no svg{color:var(--c3)}.w .ex{margin-top:8px;padding-left:14px;border-left:3px solid var(--c1);font-size:16px;line-height:1.55}
.w .nx{display:none;align-items:center;justify-content:center;margin:18px auto 0;min-height:56px;max-width:420px;padding:12px;font-size:18px;font-weight:800;border-radius:14px;border:1px solid var(--c1);background:rgba(111,130,230,.22);text-align:center}
.w .sc{display:none;margin-top:26px;text-align:center;font-size:17px}.w .sc b{display:block;font-size:40px;line-height:1.15}
.w .rs{text-align:center;padding:18px 0 6px}.w .rg{position:relative;width:148px;height:148px;margin:0 auto}.w .rg svg{display:block;width:100%;height:100%}.w .rg circle{fill:none;stroke-width:14}.w .rg .t0{stroke:var(--border)}.w .rg .t1{stroke:var(--c2)}.w .rg .pc{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800}.w .rs p{margin:14px 0 0;font-size:18px;font-weight:700}
.w .cg{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.w .cp{display:flex;align-items:center;gap:6px;min-width:64px;min-height:44px;justify-content:center;padding:0 12px;border-radius:12px;border:1px solid var(--border);font-size:16px;font-weight:700}.w .cp svg{width:16px;height:16px}.w .cp.a svg{color:var(--c2)}.w .cp.b svg{color:var(--c3)}
/* geniş ekran (tablet yatay, telefon yatay): şıklar 2×2; ince-uzun düğme yok */
@media(min-width:600px){.w .os{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}.w .o{min-height:92px}.w .hn{min-height:48px;padding:0 24px}}
</style>
<div class='w' id='w'></div>
<script>(function(){/* Her soru: [metin, şıklar, doğru indeks, açıklama, ipucu (isteğe bağlı), konu (görünmez)]. Metin ve şıklar "İngilizce (Türkçe)" yazılır; sondaki parantez Türkçe satıra ayrılır. 1 soru: tek soru; 2-3 soru: alt alta mini test; 4+ soru: tek tek tam test. */
var Q=[['Which lipid gives glycerol, 2 fatty acids, phosphate and choline on complete hydrolysis? (Tam hidrolizde gliserol, 2 yağ asidi, fosfat ve kolin veren lipit hangisidir?)',['Triacylglycerol (Triaçilgliserol)','Phospholipid (Fosfolipit)','Wax (Mum)','Derived lipid (Türev lipit)'],1,'Fosfat ve kolin ek gruptur: compound lipid (bileşik lipit). Yağ asidi 2 olduğu için triacylglycerol olamaz.','Ürünlerde yağ asidi ve alkol dışında ne var? Fazladan grup varsa sınıf değişir.','Lipid sınıfları'],['How many moles of water are released when 1 mole of triacylglycerol forms by esterification? (1 mol triaçilgliserol esterleşmeyle oluşurken kaç mol su çıkar?)',['1 mole (1 mol)','2 moles (2 mol)','3 moles (3 mol)','4 moles (4 mol)'],2,'Gliserolün 3 OH grubu 3 yağ asidine bağlanır: 3 ester bağı, 3 su.','Gliserolde kaç OH var? Her ester bağı bir su çıkarır.','Esterleşme'],['Hydrolysis gives only a fatty acid and a long-chain alcohol, no glycerol. Which lipid is it? (Hidrolizde yalnız yağ asidi ve uzun zincirli alkol çıkıyor, gliserol yok. Bu lipit hangisi?)',['Triacylglycerol (Triaçilgliserol)','Phospholipid (Fosfolipit)','Carotenoid (Karotenoid)','Wax (Mum)'],3,'Wax, uzun zincirli alkolün esteridir; gliserol yoksa triacylglycerol değildir.','Gliserol yoksa hangi alkol esteri kalır?','Mumlar']],
w=document.getElementById('w'),L='ABCDE',n=Q.length,LIST=n<=3,i=0,res=[],dn=0;
var CK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',XX='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
function sp(s){s=String(s).trim();if(s.charAt(s.length-1)==')'){var d=0,k=-1;for(var j=s.length-1;j>=0;j--){var c=s.charAt(j);if(c==')')d++;else if(c=='('){d--;if(d==0){k=j;break}}}if(k>0&&s.charAt(k-1)==' ')return[s.slice(0,k).trim(),s.slice(k)]}return[s,'']}
function qh(q,k){var a=sp(q[0]),h='<div class="qc" data-a="'+q[2]+'" data-k="'+k+'">'+(n>1?'<div class="ql">Soru '+(k+1)+' / '+n+'</div>':'')+'<div class="qe">'+a[0]+'</div>'+(a[1]?'<div class="qr">'+a[1]+'</div>':'')+'<div class="os">';q[1].forEach(function(o,j){var b=sp(o);h+='<div role="button" tabindex="0" class="o p'+j+'" data-j="'+j+'"><span class="l">'+L.charAt(j)+'</span><span class="x"><span class="en">'+b[0]+'</span>'+(b[1]?'<span class="tr">'+b[1]+'</span>':'')+'</span><span class="mk"></span></div>'});h+='</div>';if(q[4])h+='<div role="button" tabindex="0" class="hn">İpucu</div><div class="ht">'+q[4]+'</div>';return h+'<div class="fb"></div>'+(!LIST&&n>1?'<div role="button" tabindex="0" class="nx">'+(k==n-1?'Sonucu gör':'Sonraki soru')+'</div>':'')+'</div>'}
function seg(){var h='<div class="sg">';for(var k=0;k<n;k++)h+='<i class="'+(res[k]===undefined?(k==i?'cu':''):res[k]?'ok':'no')+'"></i>';return h+'</div>'}
function score(){var s=0;res.forEach(function(r){if(r)s++});return s}
function final(){var s=score(),C=2*Math.PI*60,h='<div class="rs"><div class="rg"><svg viewBox="0 0 148 148"><circle class="t0" cx="74" cy="74" r="60"/><circle class="t1" cx="74" cy="74" r="60" stroke-dasharray="'+(C*s/n).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 74 74)" stroke-linecap="round"/></svg><div class="pc">'+s+' / '+n+'</div></div><p>'+(s==n?'Hepsi doğru':'Yanlışlara bir daha bak')+'</p><div class="cg">';res.forEach(function(r,k){h+='<div class="cp '+(r?'a':'b')+'">'+(r?CK:XX)+(k+1)+'</div>'});w.innerHTML=h+'</div></div>'}
function show(){if(LIST){w.innerHTML=Q.map(qh).join('')+'<div class="sc" id="sc"></div>';return}if(i>=n){final();return}w.innerHTML=(n>1?seg():'')+qh(Q[i],i)}
w.onclick=function(e){var x=e.target;while(x&&x!==w){var c=x.classList;
if(c.contains('hn')){x.style.display='none';x.nextElementSibling.style.display='block';return}
if(c.contains('nx')){i++;show();return}
if(c.contains('o')){var q=x.parentNode.parentNode;if(q.getAttribute('data-done'))return;q.setAttribute('data-done','1');var a=+q.getAttribute('data-a'),j=+x.getAttribute('data-j'),k=+q.getAttribute('data-k'),os=q.querySelectorAll('.o');
for(var t=0;t<os.length;t++){if(t==a){os[t].classList.add('ok');os[t].querySelector('.mk').innerHTML=CK}else if(t==j){os[t].classList.add('no');os[t].querySelector('.mk').innerHTML=XX}else os[t].classList.add('dn')}
var hb=q.querySelector('.hn');if(hb){hb.style.display='none';q.querySelector('.ht').style.display='none'}
q.querySelector('.fb').innerHTML='<div class="bn '+(j==a?'ok':'no')+'">'+(j==a?CK+'Doğru':XX+'Yanlış · doğru cevap: '+L.charAt(a))+'</div><div class="ex">'+Q[k][3]+'</div>';
res[k]=(j==a);var nx=q.querySelector('.nx');if(nx)nx.style.display='flex';
dn++;if(LIST&&n>1&&dn==n){var sc=document.getElementById('sc');sc.style.display='block';sc.innerHTML='<b>'+score()+' / '+n+'</b>'+(score()==n?'Hepsi doğru':'Yanlışlara bir daha bak')}
if(!LIST&&n>1){var s=w.querySelector('.sg');if(s){var is=s.children;is[k].className=res[k]?'ok':'no'}}return}
x=x.parentNode}};
show()})()</script>
