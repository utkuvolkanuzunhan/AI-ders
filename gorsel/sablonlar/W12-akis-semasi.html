<!-- W12 | Akış şeması | Yöntem ya da süreç sırası; adımlar okla bağlı, dokununca açıklama -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.w .fl{display:flex;flex-direction:column;align-items:stretch}
.w .sp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:3px solid var(--c);background:color-mix(in srgb,var(--c) 12%,transparent);transition:background .2s,box-shadow .2s}
.w .sp .n{flex:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--c);color:#fff;font-size:16px}.w .sp b{font-size:17px}.w .sp small{display:block;font-size:14px;color:var(--text-secondary);margin-top:2px}
.w .sp.on{background:color-mix(in srgb,var(--c) 34%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 26%,transparent)}
.w .ar{height:26px;display:flex;justify-content:center}.w .ar svg{height:26px;width:20px}.w .ar path{fill:none;stroke:var(--border);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.w .sp .fr,.w .sp .eb{font-size:1.3em}.w .fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;font-weight:700;margin:0 .1em}.w .fr>span:first-child{border-bottom:.08em solid currentColor;padding:0 .12em .05em}.w .eb{display:inline-grid;grid-template-columns:auto auto;align-items:end;vertical-align:bottom}.w .eb .e{grid-column:1;grid-row:2}.w .eb .ex{grid-column:2;grid-row:1;font-size:.72em;margin:0 0 .35em .08em}.w .s{margin-top:14px;background:var(--surface-1);border-radius:14px;padding:14px 16px;min-height:84px;font-size:16px;line-height:1.45;border-left:8px solid var(--c)}.w .s b{display:block;font-size:18px;margin-bottom:4px}
</style>
<div class='w'><div class='fl' id='f'></div><div class='s c1' id='s'>Bir adıma dokun 👆</div><div class='h'>Ne yapacaksın: kutulara yukarıdan aşağı dokun. Ne göreceksin: her adımın nedeni ve tuzağı.</div></div>
<script>(function(){var D=[['c1','°C → K','Sıcaklıkları çevir','K = °C + 273,15. En sık yapılan hata bu adımı atlamak.'],['c2','Ters fark','<span class="fr"><span>1</span><span>T₁</span></span> − <span class="fr"><span>1</span><span>T₂</span></span>','Sıra önemli; ters alırsan işaret değişir, oran 1\'in altına düşer.'],['c4','<span class="fr"><span>Eₐ</span><span>R</span></span> ile çarp','Eₐ J/mol olmalı','kJ/mol bırakırsan sonuç 1000 kat küçük çıkar.'],['c3','e üssünü al','Sonuç = kaç kat','ln\'den kurtulmak için e tabanında üs alınır. Sonuç, k₂ değerinin k₁ değerinin kaç katı olduğudur.']],f=document.getElementById('f'),h='';D.forEach(function(d,i){if(i)h+='<div class="ar"><svg viewBox="0 0 20 26"><path d="M10 2 V22 M4 16 L10 22 L16 16"/></svg></div>';h+='<div role="button" tabindex="0" class="sp '+d[0]+'" data-i="'+i+'"><span class="n">'+(i+1)+'</span><div><b>'+d[1]+'</b><small>'+d[2]+'</small></div></div>'});f.innerHTML=h;var ss=f.querySelectorAll('.sp');ss.forEach(function(b){b.onclick=function(){var d=D[+b.dataset.i];ss.forEach(function(x){x.classList.toggle('on',x==b)});var s=document.getElementById('s');s.className='s '+d[0];s.innerHTML='<b>'+(+b.dataset.i+1)+'. '+d[1]+'</b>'+d[3]}})})()</script>
