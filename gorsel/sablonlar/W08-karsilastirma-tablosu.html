<!-- W08 | Karşılaştırma tablosu | İki-üç yöntem/durum yan yana; dokununca satır vurgulanır, ayrıntı kartı açılır -->
<style>:root{--c1:#5B9BD5;--c2:#45B39D;--c3:#E0924A;--c4:#A38BD6;--c5:#E07A92}html,body{overflow:hidden}.w,.w *{-webkit-text-size-adjust:100%;text-size-adjust:100%;box-sizing:border-box}.w{color:var(--text-primary);padding:6px;font-family:inherit}.w .h{font-size:15px;color:var(--text-secondary);margin-top:14px;line-height:1.4}.w [role=button]{cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent}.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}
.w .tb{display:grid;grid-template-columns:repeat(var(--k),minmax(0,1fr));gap:5px;font-size:15px}.w .tb>div{padding:9px 5px;line-height:1.3}
.w .hc{border-radius:12px 12px 4px 4px;text-align:center;font-weight:800;font-size:clamp(13px,3.6vw,16px);background:color-mix(in srgb,var(--c) 28%,transparent);border-bottom:3px solid var(--c)}.w .hc i{display:block;font-style:normal;font-size:24px}
.w .lb{grid-column:1/-1;font-size:13px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:6px;padding:8px 10px!important;border:2px solid var(--border);display:flex;justify-content:space-between}.w .lb::after{content:'👆';text-transform:none}.w .lb.on::after{content:'●';color:var(--c3)}
.w .cl{background:var(--surface-1);border-radius:8px;text-align:center;transition:background .2s}.w .cl.on{background:color-mix(in srgb,var(--c) 26%,transparent);font-weight:700}
.w .rw{border-radius:8px}.w .rw.on{background:color-mix(in srgb,var(--text-primary) 8%,transparent)}
.w .s{margin-top:12px;background:var(--surface-1);border-radius:14px;padding:14px 16px;min-height:86px;font-size:16px;line-height:1.45;border-left:8px solid var(--c3)}.w .s b{display:block;font-size:18px;margin-bottom:4px}
</style>
<div class='w'><div class='tb' id='tb' style='--k:3'></div><div class='s' id='s'>Bir satırın etiketine dokun 👆</div><div class='h'>Ne yapacaksın: satır başlıklarına dokun. Ne göreceksin: o özellikte üç yöntemin farkı ve sınav ipucu.</div></div>
<script>(function(){var C=[['c1','🥛','Pastörizasyon'],['c2','♨️','UHT'],['c3','🥫','Sterilizasyon']],R=[['Sıcaklık',['72 °C','135–150 °C','121 °C'],'Sıcaklık arttıkça süre kısalır; UHT en yüksek sıcaklık, en kısa süre.'],['Süre',['15 s','2–5 s','15+ dk'],'Sınavda sık tuzak: sterilizasyon UHT\'den düşük sıcaklıkta ama çok daha uzun sürer.'],['Hedef',['Patojenler','Tüm mikroplar','Mikroplar + sporlar'],'Pastörizasyon ürünü steril yapmaz; soğuk zincir gerekir.'],['Raf ömrü',['1–2 hafta (soğukta)','3–6 ay','1–2 yıl'],'Raf ömrü, öldürülen mikroorganizma grubuna bağlı.']],tb=document.getElementById('tb'),h='';C.forEach(function(c){h+='<div class="hc '+c[0]+'"><i>'+c[1]+'</i>'+c[2]+'</div>'});R.forEach(function(r,i){h+='<div role="button" tabindex="0" class="lb rw" data-i="'+i+'">'+r[0]+'</div>';r[1].forEach(function(v,j){h+='<div class="cl '+C[j][0]+'" data-r="'+i+'">'+v+'</div>'})});tb.innerHTML=h;tb.querySelectorAll('.rw').forEach(function(b){b.onclick=function(){var i=b.dataset.i;tb.querySelectorAll('.rw').forEach(function(x){x.classList.toggle('on',x==b)});tb.querySelectorAll('.cl').forEach(function(x){x.classList.toggle('on',x.dataset.r==i)});document.getElementById('s').innerHTML='<b>'+R[i][0]+'</b>'+R[i][2]}})})()</script>
